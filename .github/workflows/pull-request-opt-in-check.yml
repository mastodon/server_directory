---
name: Opt-in check
on:
  push:

jobs:
  Schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Get Changed Default Servers
        id: getfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep '^default_servers/' | xargs -I {} basename {} .yaml | xargs)" >> $GITHUB_OUTPUT

      - name: Request Opt-in file
        if: ${{ steps.getfile.outputs.files != '' }}
        run: |
            FILES="${{ steps.getfile.outputs.files }}"
            for domain in $FILES; do
              RESPONSE_CODE=$(curl --silent --connect-timeout 5 --output /dev/null -I --write-out "%{http_code}" "http://${domain}/dsr_opt_in.txt" || echo "000")

              if [ "$RESPONSE_CODE" -ne 301 ]; then
                echo "$domain is not reachable Statuscode: $RESPONSE_CODE"
                FAILED=$((FAILED + 1))
              else
                echo "$domain exists and is reachable Statuscode: $RESPONSE_CODE"
              fi
            done

            if [ "$FAILED" -gt 0 ]; then
              echo "not all endpoint could be reached"
              exit 1
            fi
