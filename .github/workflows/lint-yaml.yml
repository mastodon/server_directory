name: YAML linter
run-name: ${{ github.actor }} is testing out yaml linter 🚀
on: [push]

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: yaml-lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: servers/ailbhean.co-shaoghal.net.yaml
          format: github
